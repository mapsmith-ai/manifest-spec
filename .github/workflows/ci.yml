name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest jsonschema ruff==0.16.3
      - run: ruff check .
      - run: pytest -q
      # The floor is deliberately old: a validator anyone can run must run on
      # the Python they already have.
      - run: python validator/validate.py conformance/valid/*.json
